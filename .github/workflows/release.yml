name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-mpfr
            mingw-w64-ucrt-x86_64-gmp
          update: true

      - name: Compile (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y libomp-dev libmpfr-dev libgmp-dev
          
          g++ -O3 main.cpp -o Mandelbrot_linux_mavx2 -mavx2 -fopenmp -lmpfr -lgmp -static-libstdc++ -static-libgcc
          strip Mandelbrot_linux_mavx2
          chmod +x Mandelbrot_linux_mavx2
          
          g++ -O3 main.cpp -o Mandelbrot_linux_msse3 -msse3 -fopenmp -lmpfr -lgmp -static-libstdc++ -static-libgcc
          strip Mandelbrot_linux_msse3
          chmod +x Mandelbrot_linux_msse3

          chmod +x ffmpeg
          tar -czvf Mandelbrot_linux_x64.tar.gz Mandelbrot_linux_mavx2 Mandelbrot_linux_msse3 ffmpeg

      - name: Compile (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          if [ -f resource.rc ]; then
            windres resource.rc -o resource.o
            RESOURCE_OBJ="resource.o"
          else
            RESOURCE_OBJ=""
          fi
          
          g++ -O3 main.cpp $RESOURCE_OBJ -o Mandelbrot_windows_mavx2.exe -mavx2 -fopenmp -static-libstdc++ -static-libgcc -Wl,-Bstatic -lmpfr -lgmp -Wl,-Bdynamic
          strip Mandelbrot_windows_mavx2.exe
          
          g++ -O3 main.cpp $RESOURCE_OBJ -o Mandelbrot_windows_msse3.exe -msse3 -fopenmp -static-libstdc++ -static-libgcc -Wl,-Bstatic -lmpfr -lgmp -Wl,-Bdynamic
          strip Mandelbrot_windows_msse3.exe

          powershell.exe "Compress-Archive -Path Mandelbrot_windows_mavx2.exe, Mandelbrot_windows_msse3.exe, ffmpeg.exe -DestinationPath Mandelbrot_windows_x64.zip"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: |
            Mandelbrot_linux_x64.tar.gz
            Mandelbrot_windows_x64.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.MY_RELEASE_PAT }}
          name: "Mandelbrot CLI: Renderer with 1000-Digit Precision and Perturbation Theory ${{ github.ref_name }}"
          body: |
            ## Mandelbrot CLI: Renderer with 1000-Digit Precision and Perturbation Theory

            ### Available Downloads
            * **Windows (UCRT64):**
              * `Mandelbrot_windows_x64.zip` - Includes optimized builds (`mavx2`, `msse3`) and `ffmpeg.exe`.
            * **Linux (x64):**
              * `Mandelbrot_linux_x64.tar.gz` - Includes optimized builds (`mavx2`, `msse3`) and native `ffmpeg`.

            ### Core Features
            * **High-Precision Reference:** The 5000-bit reference trajectory is computed exactly once per zoom layer.
            * **Hardware-Native Performance:** Blazing-fast math for millions of pixels utilizing hardware-native double registers.
            * **Innovative Algorithm:** Revolutionary *Reference Reset to Zero* implementation.
            * **True 8x8 SSAA:** Pristine, anti-aliased image quality with 64 independent samples per pixel.
            * **OpenMP Multi-threading:** High-speed parallel computing to maximize CPU utilization.        
            * **Yes, this is FFmpeg**-the 'Swiss Army knife' of video processing.
            
            <video src="https://github.com/user-attachments/assets/852adaf6-5921-486d-b7cb-6d3e326302a8" controls width="1000"></video>
            <video src="https://github.com/user-attachments/assets/01edb228-9685-4f66-ba3b-a5492d3d3045" controls width="1000"></video>
            <video src="https://github.com/user-attachments/assets/2dbb60b2-5be4-4bb6-be1c-3f4f1d3cef77" controls width="1000"></video>
            <video src="https://github.com/user-attachments/assets/66c067b8-1237-48cb-905f-b7049e8a0677" controls width="1000"></video>
            <video src="https://github.com/user-attachments/assets/2c90c6d0-2889-43a8-9d02-60ca35922cd5" controls width="1000"></video>
            <video src="https://github.com/user-attachments/assets/d4d28260-9c7f-4ba7-8ce9-9f04c07ee58c" controls width="1000"></video>

          files: |
            binary-windows-latest/Mandelbrot_windows_x64.zip
            binary-ubuntu-latest/Mandelbrot_linux_x64.tar.gz
