name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-mpfr
            mingw-w64-ucrt-x86_64-gmp
          update: true

      - name: Compile (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y libomp-dev libmpfr-dev libgmp-dev
          
          g++ -O3 main.cpp -o Mandelbrot_linux_mavx2 -mavx2 -fopenmp -lmpfr -lgmp -static-libstdc++ -static-libgcc
          strip Mandelbrot_linux_mavx2
          chmod +x Mandelbrot_linux_mavx2
          
          g++ -O3 main.cpp -o Mandelbrot_linux_msse3 -msse3 -fopenmp -lmpfr -lgmp -static-libstdc++ -static-libgcc
          strip Mandelbrot_linux_msse3
          chmod +x Mandelbrot_linux_msse3

          chmod +x ffmpeg
          tar -czvf Mandelbrot_linux_x64.tar.gz Mandelbrot_linux_mavx2 Mandelbrot_linux_msse3 ffmpeg

      - name: Compile (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          if [ -f resource.rc ]; then
            windres resource.rc -o resource.o
            RESOURCE_OBJ="resource.o"
          else
            RESOURCE_OBJ=""
          fi
          
          g++ -O3 main.cpp $RESOURCE_OBJ -o Mandelbrot_windows_mavx2.exe -mavx2 -fopenmp -static -static-libgcc -static-libstdc++ -Wl,--start-group -lmpfr -lgmp -lgomp -lwinpthread -Wl,--end-group
          strip Mandelbrot_windows_mavx2.exe
          
          g++ -O3 main.cpp $RESOURCE_OBJ -o Mandelbrot_windows_msse3.exe -msse3 -fopenmp -static-libstdc++ -static-libgcc -Wl,-Bstatic -lmpfr -lgmp -Wl,-Bdynamic
          strip Mandelbrot_windows_msse3.exe

          powershell.exe "Compress-Archive -Path Mandelbrot_windows_mavx2.exe, Mandelbrot_windows_msse3.exe, ffmpeg.exe -DestinationPath Mandelbrot_windows_x64.zip"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: |
            Mandelbrot_linux_x64.tar.gz
            Mandelbrot_windows_x64.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.MY_RELEASE_PAT }}
          name: "Mandelbrot CLI: Renderer with Perturbation Theory (with a 1e-308 hardware limit) ${{ github.ref_name }}"
          body: |
            ### Available Downloads
            * **Windows (UCRT64):**
              * `Mandelbrot_windows_x64.zip` - Includes optimized builds (`mavx2`, `msse3`) and `ffmpeg.exe`.
            * **Linux (x64):**
              * `Mandelbrot_linux_x64.tar.gz` - Includes optimized builds (`mavx2`, `msse3`) and native `ffmpeg`.

            ### Core Features
            * **High-Precision Reference:** The 1000-bit reference trajectory is computed exactly once per zoom layer.
            * **Hardware-Native Performance:** Blazing-fast math for billions of pixels utilizing hardware-native double registers.
            * When using double-precision floating-point numbers (on the order of 1e-15, perturbation theory only allows you to zoom down to the **1e-308 level-no further.**
            * **Innovative Algorithm:** Revolutionary *Reference Reset to Zero* implementation.
            * **Bilinear approximation:** The calculation can be performed significantly faster by using bilinear approximation.
            * **True 8x8 SSAA:** Pristine, anti-aliased image quality with 64 independent samples per pixel.
            * **OpenMP Multi-threading:** High-speed parallel computing to maximize CPU utilization.        
            * **Yes, this is FFmpeg**-the 'Swiss Army knife' of video processing.
            
            <video src="https://github.com/user-attachments/assets/075bc0cc-51ae-4629-a51c-cf9c2a3d7b9f" controls width="1000"></video>
            <video src="https://github.com/user-attachments/assets/c1b5ecce-0a72-4779-8d2f-dd19b17e40b8" controls width="1000"></video>
            <video src="https://github.com/user-attachments/assets/cb2f6b68-d1eb-43c1-9204-e90783ea8b33" controls width="1000"></video>
            <video src="https://github.com/user-attachments/assets/7e3dd648-65e6-49ae-9236-8e1edc4d43a9" controls width="1000"></video>
            <video src="https://github.com/user-attachments/assets/09379acf-adef-48d9-88e1-7b17af3eba4a" controls width="1000"></video>
            <video src="https://github.com/user-attachments/assets/c9dda736-e948-47f9-94c5-321b5c30700e" controls width="1000"></video>
            <video src="https://github.com/user-attachments/assets/8ee34d4b-bc5b-481f-95ee-7b0df994d7d0" controls width="1000"></video>

          files: |
            binary-windows-latest/Mandelbrot_windows_x64.zip
            binary-ubuntu-latest/Mandelbrot_linux_x64.tar.gz
