name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-mpfr
            mingw-w64-ucrt-x86_64-gmp
            zip
          update: true

      - name: Compile (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y libmpfr-dev libgmp-dev
          
          g++ -O3 main-1.cpp -o Mandelbrot_linux_mavx2-1 -mavx2 -lmpfr -lgmp -static-libstdc++ -static-libgcc
          strip Mandelbrot_linux_mavx2-1
          chmod +x Mandelbrot_linux_mavx2-1
          
          g++ -O3 main-1.cpp -o Mandelbrot_linux_msse3-1 -msse3 -lmpfr -lgmp -static-libstdc++ -static-libgcc
          strip Mandelbrot_linux_msse3-1
          chmod +x Mandelbrot_linux_msse3-1

          g++ -O3 main-2.cpp -o Mandelbrot_linux_mavx2-2 -mavx2 -lmpfr -lgmp -static-libstdc++ -static-libgcc
          strip Mandelbrot_linux_mavx2-2
          chmod +x Mandelbrot_linux_mavx2-2
          
          g++ -O3 main-2.cpp -o Mandelbrot_linux_msse3-2 -msse3 -lmpfr -lgmp -static-libstdc++ -static-libgcc
          strip Mandelbrot_linux_msse3-2
          chmod +x Mandelbrot_linux_msse3-2

          g++ -O3 main-3.cpp -o Mandelbrot_linux_mavx2-3 -mavx2 -lmpfr -lgmp -static-libstdc++ -static-libgcc
          strip Mandelbrot_linux_mavx2-3
          chmod +x Mandelbrot_linux_mavx2-3
          
          g++ -O3 main-3.cpp -o Mandelbrot_linux_msse3-3 -msse3 -lmpfr -lgmp -static-libstdc++ -static-libgcc
          strip Mandelbrot_linux_msse3-3
          chmod +x Mandelbrot_linux_msse3-3

          chmod +x ffmpeg
          tar -czvf Mandelbrot_linux_x64.tar.gz Mandelbrot_linux_mavx2-1 Mandelbrot_linux_msse3-1 Mandelbrot_linux_mavx2-2 Mandelbrot_linux_msse3-2 Mandelbrot_linux_mavx2-3 Mandelbrot_linux_msse3-3 ffmpeg

      - name: Compile (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          if [ -f resource.rc ]; then
            windres resource.rc -o resource.o
            RESOURCE_OBJ="resource.o"
          else
            RESOURCE_OBJ=""
          fi
          
          g++ -O3 main-1.cpp $RESOURCE_OBJ -o Mandelbrot_windows_mavx2-1.exe -mavx2 -static -static-libgcc -static-libstdc++ -Wl,--start-group -lmpfr -lgmp -lwinpthread -Wl,--end-group
          strip Mandelbrot_windows_mavx2-1.exe
          
          g++ -O3 main-1.cpp $RESOURCE_OBJ -o Mandelbrot_windows_msse3-1.exe -msse3 -static -static-libgcc -static-libstdc++ -Wl,--start-group -lmpfr -lgmp -lwinpthread -Wl,--end-group
          strip Mandelbrot_windows_msse3-1.exe

          g++ -O3 main-2.cpp $RESOURCE_OBJ -o Mandelbrot_windows_mavx2-2.exe -mavx2 -static -static-libgcc -static-libstdc++ -Wl,--start-group -lmpfr -lgmp -lwinpthread -Wl,--end-group
          strip Mandelbrot_windows_mavx2-2.exe
          
          g++ -O3 main-2.cpp $RESOURCE_OBJ -o Mandelbrot_windows_msse3-2.exe -msse3 -static -static-libgcc -static-libstdc++ -Wl,--start-group -lmpfr -lgmp -lwinpthread -Wl,--end-group
          strip Mandelbrot_windows_msse3-2.exe

          g++ -O3 main-3.cpp $RESOURCE_OBJ -o Mandelbrot_windows_mavx2-3.exe -mavx2 -static -static-libgcc -static-libstdc++ -Wl,--start-group -lmpfr -lgmp -lwinpthread -Wl,--end-group
          strip Mandelbrot_windows_mavx2-3.exe
          
          g++ -O3 main-3.cpp $RESOURCE_OBJ -o Mandelbrot_windows_msse3-3.exe -msse3 -static -static-libgcc -static-libstdc++ -Wl,--start-group -lmpfr -lgmp -lwinpthread -Wl,--end-group
          strip Mandelbrot_windows_msse3-3.exe

          powershell.exe "Compress-Archive -Path Mandelbrot_windows_mavx2-1.exe, Mandelbrot_windows_msse3-1.exe, Mandelbrot_windows_mavx2-2.exe, Mandelbrot_windows_msse3-2.exe, Mandelbrot_windows_mavx2-3.exe, Mandelbrot_windows_msse3-3.exe, ffmpeg.exe -DestinationPath Mandelbrot_windows_x64.zip"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: |
            Mandelbrot_linux_x64.tar.gz
            Mandelbrot_windows_x64.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.MY_RELEASE_PAT }}
          name: "Mandelbrot VIDEO ${{ github.ref_name }}"
          body: |
            ### Available Downloads
            * **Windows (UCRT64):**
              * `Mandelbrot_windows_x64.zip` - Includes optimized builds (`mavx2`, `msse3`) and `ffmpeg.exe`.
            * **Linux (x64):**
              * `Mandelbrot_linux_x64.tar.gz` - Includes optimized builds (`mavx2`, `msse3`) and native `ffmpeg`.

            ### Features:
            * **High-Precision Reference:** The 1000-bit reference trajectory is computed exactly once per zoom layer.
            * **Hardware-Native Performance:** Blazing-fast math for billions of pixels utilizing hardware-native double registers.
            * **Dynamic Reference Relocalization:** Professional *Reset to Zero* implementation ensuring flawless orbit re-basing without precision loss.
            * **Bilinear approximation:** The calculation can be performed significantly faster by using bilinear approximation.
            * **True 3x3 SSAA:** Pristine, anti-aliased image quality with 9 independent samples per pixel.
            * **Pure C++11 Multi-threading:** High-speed parallel computing built directly into the language standard.
            * **Yes, this is FFmpeg**-the 'Swiss Army knife' of video processing.

            <video src="https://github.com/user-attachments/assets/f2271a78-eba7-4e5b-a7c8-7d246490b7db"></video>

          files: |
            binary-windows-latest/Mandelbrot_windows_x64.zip
            binary-ubuntu-latest/Mandelbrot_linux_x64.tar.gz
