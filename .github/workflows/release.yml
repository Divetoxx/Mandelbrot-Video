name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-mpfr
            mingw-w64-ucrt-x86_64-gmp
            zip
          update: true

      - name: Compile (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y libmpfr-dev libgmp-dev
          
          g++ -O3 main.cpp -o Mandelbrot_linux_mavx2 -mavx2 -lmpfr -lgmp -static-libstdc++ -static-libgcc
          strip Mandelbrot_linux_mavx2
          chmod +x Mandelbrot_linux_mavx2
          
          g++ -O3 main.cpp -o Mandelbrot_linux_msse3 -msse3 -lmpfr -lgmp -static-libstdc++ -static-libgcc
          strip Mandelbrot_linux_msse3
          chmod +x Mandelbrot_linux_msse3

          chmod +x ffmpeg
          tar -czvf Mandelbrot_linux_x64.tar.gz Mandelbrot_linux_mavx2 Mandelbrot_linux_msse3 ffmpeg

      - name: Compile (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          if [ -f resource.rc ]; then
            windres resource.rc -o resource.o
            RESOURCE_OBJ="resource.o"
          else
            RESOURCE_OBJ=""
          fi
          
          g++ -O3 main.cpp $RESOURCE_OBJ -o Mandelbrot_windows_mavx2.exe -mavx2 -static -static-libgcc -static-libstdc++ -Wl,--start-group -lmpfr -lgmp -lwinpthread -Wl,--end-group
          strip Mandelbrot_windows_mavx2.exe
          
          g++ -O3 main.cpp $RESOURCE_OBJ -o Mandelbrot_windows_msse3.exe -msse3 -static -static-libgcc -static-libstdc++ -Wl,--start-group -lmpfr -lgmp -lwinpthread -Wl,--end-group
          strip Mandelbrot_windows_msse3.exe

          powershell.exe "Compress-Archive -Path Mandelbrot_windows_mavx2.exe, Mandelbrot_windows_msse3.exe, ffmpeg.exe -DestinationPath Mandelbrot_windows_x64.zip"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: |
            Mandelbrot_linux_x64.tar.gz
            Mandelbrot_windows_x64.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.MY_RELEASE_PAT }}
          name: "Mandelbrot CLI: Renderer with Perturbation Theory and Bilinear approximation ${{ github.ref_name }}"
          body: |
            ### Available Downloads
            * **Windows (UCRT64):**
              * `Mandelbrot_windows_x64.zip` - Includes optimized builds (`mavx2`, `msse3`) and `ffmpeg.exe`.
            * **Linux (x64):**
              * `Mandelbrot_linux_x64.tar.gz` - Includes optimized builds (`mavx2`, `msse3`) and native `ffmpeg`.

            ### Features:
            * **High-Precision Reference:** The 1000-bit reference trajectory is computed exactly once per zoom layer.
            * **Hardware-Native Performance:** Blazing-fast math for billions of pixels utilizing hardware-native double registers.
            * **Dynamic Reference Relocalization:** Professional *Reset to Zero* implementation ensuring flawless orbit re-basing without precision loss.
            * **Bilinear approximation:** The calculation can be performed significantly faster by using bilinear approximation.
            * **True 8x8 SSAA:** Pristine, anti-aliased image quality with 64 independent samples per pixel.
            * **Pure C++11 Multi-threading:** High-speed parallel computing built directly into the language standard.
            * **Yes, this is FFmpeg**-the 'Swiss Army knife' of video processing.

            <video src="https://github.com/user-attachments/assets/bf4c67c9-48e7-4b1e-b855-a6b27e449481" controls width="1000"></video>
            <video src="https://github.com/user-attachments/assets/019a873e-55bb-4616-a92a-cf9825672798" controls width="1000"></video>
            <video src="https://github.com/user-attachments/assets/1111a250-20d9-46f7-8d87-e4ea843c48d5" controls width="1000"></video>
            <video src="https://github.com/user-attachments/assets/ec5accfe-b53e-48d6-a971-10af14999527" controls width="1000"></video>
            <video src="https://github.com/user-attachments/assets/545b722a-a2a5-4ec2-ba5c-8a5c9d052a32" controls width="1000"></video>
            <video src="https://github.com/user-attachments/assets/37a76cb8-992b-4d08-84dd-c8b5138eec1a" controls width="1000"></video>
            <video src="https://github.com/user-attachments/assets/74aa5a47-8197-4c16-a7c5-4bffc1204ea0" controls width="1000"></video>
            <video src="https://github.com/user-attachments/assets/14efdbea-797f-420d-9694-72625f2b0e0a" controls width="1000"></video>
            <video src="https://github.com/user-attachments/assets/d104f654-a498-4ff7-a9db-d48dd0f98c61" controls width="1000"></video>

          files: |
            binary-windows-latest/Mandelbrot_windows_x64.zip
            binary-ubuntu-latest/Mandelbrot_linux_x64.tar.gz
